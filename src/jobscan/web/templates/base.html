<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Job Scanner{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <strong class="brand">Job Scanner</strong>
  <nav>
    <a href="{{ url_for('roles') }}" {% if endpoint in ('roles', 'role_page', 'role_save') %}class="on"{% endif %}>Roles</a>
    <a href="{{ url_for('summary') }}" {% if endpoint == 'summary' %}class="on"{% endif %}>Summary</a>
    <a href="{{ url_for('eval_page') }}" {% if endpoint in ('eval_page', 'eval_exclude') %}class="on"{% endif %}>Eval</a>
    <a href="{{ url_for('cv_page') }}" {% if endpoint in ('cv_page', 'cv_upload') %}class="on"{% endif %}>CV</a>
    <a href="{{ url_for('runs') }}" {% if endpoint == 'runs' %}class="on"{% endif %}>Run Log</a>
    <a href="{{ url_for('config_page') }}" {% if endpoint in ('config_page', 'config_save') %}class="on"{% endif %}>Config</a>
  </nav>
</header>
<main>
{% for category, message in get_flashed_messages(with_categories=true) %}
  <div class="flash {{ category }}" role="status">{{ message }}</div>
{% endfor %}
{% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='scroll.js') }}"></script>
<script src="{{ url_for('static', filename='flash.js') }}"></script>
<script src="{{ url_for('static', filename='tip.js') }}"></script>
</body>
</html>
